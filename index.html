<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Agent Builder Datenanzeige</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #f1f5f9, #e2e8f0);
      }

      main {
        width: min(960px, 90vw);
        background-color: rgba(255, 255, 255, 0.85);
        border-radius: 1rem;
        padding: 2.5rem;
        box-shadow: 0 1.5rem 3rem rgba(15, 23, 42, 0.18);
        backdrop-filter: blur(4px);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 5vw, 2.75rem);
        color: #0f172a;
      }

      p {
        line-height: 1.6;
        color: #334155;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 0.75rem;
        padding: 0.875rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 0.75rem 1.5rem rgba(37, 99, 235, 0.35);
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
        box-shadow: none;
        transform: none;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background-color: #0f172a;
        color: #e2e8f0;
        padding: 1.5rem;
        border-radius: 1rem;
        margin-top: 1.5rem;
        max-height: 24rem;
        overflow: auto;
      }

      .error {
        color: #dc2626;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Agent Builder Datenanzeige</h1>
      <p>
        Klicke auf den Button, um die Rohdaten von der angegebenen URL abzurufen
        und hier anzuzeigen. Bitte beachte, dass der Aufruf nur funktioniert,
        wenn du im Browser bereits am OpenAI Agent Builder angemeldet bist und
        die CORS-Richtlinien den Abruf zulassen.
      </p>
      <button id="fetch-btn">Daten abrufen</button>
      <p id="status" aria-live="polite"></p>
      <pre id="output" hidden></pre>
    </main>

    <script>
      const fetchBtn = document.getElementById("fetch-btn");
      const status = document.getElementById("status");
      const output = document.getElementById("output");

      async function fetchData() {
        fetchBtn.disabled = true;
        status.textContent = "Lade Daten ...";
        output.hidden = true;
        output.textContent = "";

        try {
          const response = await fetch(
            "https://platform.openai.com/agent-builder/edit?version=draft&workflow=wf_68e8fc5b16a081909c214829ac4998b40da455d033ddcf8a",
            {
              headers: {
                Accept: "application/json, text/plain, */*",
              },
              credentials: "include",
            }
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status} ${response.statusText}`);
          }

          const contentType = response.headers.get("content-type") || "";
          if (contentType.includes("application/json")) {
            const data = await response.json();
            output.textContent = JSON.stringify(data, null, 2);
          } else {
            const text = await response.text();
            output.textContent = text.trim();
          }

          output.hidden = false;
          status.textContent = "Daten erfolgreich geladen.";
        } catch (error) {
          status.innerHTML = `Fehler beim Laden der Daten: <span class="error">${error.message}</span>`;
        } finally {
          fetchBtn.disabled = false;
        }
      }

      fetchBtn.addEventListener("click", fetchData);
    </script>
  </body>
</html>
